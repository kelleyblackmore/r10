<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div class="window">
      <header class="titlebar">
        <span class="title">r10</span>
        <span id="status" class="status">●</span>
        <span class="spacer"></span>
        <button id="newChatBtn" class="icon-btn" title="New chat (clear conversation)" aria-label="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="hideBtn" class="icon-btn" title="Hide" aria-label="Hide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="quitBtn" class="icon-btn" title="Quit r10" aria-label="Quit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </header>

      <div id="messages" class="messages">
        <div class="msg bot">
          <div class="bubble"><em>bdeep</em> — r10 online. Ask me anything, or tap the eye button to scan your screen.</div>
        </div>
      </div>

      <div id="settings" class="settings hidden">
        <h3>Settings</h3>
        <label>AI engine
          <select id="setEngine">
            <option value="auto">Auto — use Ollama if running, else built-in</option>
            <option value="embedded">Built-in (embedded) only</option>
            <option value="ollama">Ollama only</option>
            <option value="openai">API (OpenAI-compatible) only</option>
          </select>
        </label>
        <div id="engineHint" class="hint"></div>
        <div class="settings-actions">
          <button id="dlChat">Download built-in chat model</button>
        </div>
        <hr class="sep" />
        <label>API URL<input id="setOpenaiUrl" type="text" placeholder="https://api.openai.com/v1" /></label>
        <label>API key<input id="setOpenaiKey" type="password" placeholder="sk-… (or your work token)" /></label>
        <label>API model<input id="setOpenaiModel" type="text" placeholder="gpt-4o-mini" /></label>
        <label>API vision model (optional)<input id="setOpenaiVision" type="text" placeholder="defaults to API model" /></label>
        <div id="openaiHint" class="hint"></div>
        <hr class="sep" />
        <label>Ollama URL<input id="setUrl" type="text" /></label>
        <label>Ollama chat model<input id="setChat" type="text" placeholder="llama3.2" /></label>
        <label>Ollama vision model<input id="setVision" type="text" placeholder="llama3.2-vision" /></label>
        <div id="modelHint" class="hint"></div>
        <label>Persona / system prompt<textarea id="setPrompt" rows="4"></textarea></label>
        <div class="settings-actions">
          <button id="saveSettings" class="primary">Done</button>
        </div>
      </div>

      <footer class="composer">
        <button id="lookBtn" class="icon-btn look" title="Look at my screen" aria-label="Look at my screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Talk to r10…"></textarea>
        <button id="sendBtn" class="primary send" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </footer>
    </div>
    <script src="chat.js"></script>
  </body>
</html>
