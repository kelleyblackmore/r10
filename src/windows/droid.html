<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="droid.css" />
    <!-- three.js is bundled with the app (node_modules) — nothing loads from the network. -->
    <script type="importmap">
      { "imports": { "three": "../../node_modules/three/build/three.module.min.js" } }
    </script>
  </head>
  <body>
    <div id="bubble" class="bubble hidden"></div>

    <div id="droid" class="droid idle" title="Click to chat · drag to move">
      <canvas id="stage" width="150" height="160"></canvas>
      <!-- flat fallback, shown only if WebGL can't start -->
      <div class="fallback" aria-hidden="true">
        <span class="fb-dome"><span class="fb-eye"></span></span>
        <span class="fb-body"><span class="fb-panel"></span></span>
        <span class="fb-leg fb-left"></span><span class="fb-leg fb-right"></span>
      </div>
      <!-- sleep zzz -->
      <span id="zzz" class="zzz">z</span>
    </div>

    <script type="module" src="droid.js"></script>
  </body>
</html>
