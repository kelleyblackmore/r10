# Git hooks managed by pre-commit (https://pre-commit.com).
#   pip install pre-commit   # or: brew install pre-commit
#   pre-commit install       # run on every `git commit`
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      # Bundled GGUF models belong in build/models/ (gitignored), never in git.
      - id: check-added-large-files
        # --enforce-all so CI (clean checkout, nothing staged) still checks every file.
        args: [--maxkb=1024, --enforce-all]

  - repo: local
    hooks:
      - id: node-check
        name: node --check (JS syntax)
        # node --check takes a single script; any extra paths become argv, so check each file.
        entry: bash -c 'rc=0; for f in "$@"; do node --check "$f" || rc=1; done; exit $rc' --
        language: system
        types: [javascript]
